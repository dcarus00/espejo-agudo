version: '3.8'
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: espejo-agudo-qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped
    networks:
      - espejo-agudo-net
networks:
  espejo-agudo-net:
    driver: bridge
